<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验数据导出</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans SC', -apple-system, sans-serif; background: #0a0e13; color: #ccc; padding: 20px; min-height: 100vh; }
h1 { text-align: center; color: #00ffff; margin-bottom: 8px; font-size: 1.4rem; }
.subtitle { text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 20px; }
.tab-row { text-align: center; margin-bottom: 16px; }
.tab-btn { background: rgba(15,20,25,0.9); border: 2px solid #333; color: #888; font-size: 0.95rem; padding: 10px 28px; cursor: pointer; font-family: inherit; margin: 0 4px 8px; transition: all 0.2s; }
.tab-btn.active { border-color: #00ffff; color: #00ffff; background: #00ffff11; }
.tab-btn:hover { border-color: #00ffff88; color: #00ffffaa; }
.stats { text-align: center; color: #888; margin-bottom: 16px; font-size: 0.9rem; }
.stats span { color: #00ffff; font-weight: bold; }
.source-tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 0.75rem; margin-left: 8px; }
.source-cloud { background: #00ffff22; color: #00ffff; border: 1px solid #00ffff44; }
.source-local { background: #ffaa0022; color: #ffaa00; border: 1px solid #ffaa0044; }
table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.9rem; }
th { background: #1a2030; color: #00ffff; padding: 10px 8px; text-align: left; border-bottom: 2px solid #00ffff33; white-space: nowrap; }
td { padding: 10px 8px; border-bottom: 1px solid #1a2030; }
tr:hover td { background: #111822; }
.btn-row { text-align: center; margin-bottom: 20px; }
button.action { background: rgba(15,20,25,0.9); border: 2px solid #00ffff; color: #00ffff; font-size: 0.95rem; padding: 10px 24px; cursor: pointer; font-family: inherit; margin: 0 6px 8px; }
button.action:hover { background: #00ffff22; }
button.danger { background: rgba(15,20,25,0.9); border: 2px solid #ff4444; color: #ff4444; font-size: 0.95rem; padding: 10px 24px; cursor: pointer; font-family: inherit; margin: 0 6px 8px; }
button.danger:hover { background: #ff444422; }
.empty { text-align: center; color: #555; margin-top: 60px; font-size: 1.1rem; }
.loading { text-align: center; color: #888; margin-top: 40px; }
.diag-box { max-width: 700px; margin: 0 auto 20px; padding: 14px 16px; background: rgba(15,20,25,0.7); border-left: 3px solid #00ffff66; font-size: 0.85rem; line-height: 1.7; display: none; white-space: pre-wrap; word-break: break-all; }
.diag-box.show { display: block; }
.diag-box.ok { border-left-color: #00ff88; color: #aaffcc; }
.diag-box.fail { border-left-color: #ff4444; color: #ffaaaa; }
button.test { background: rgba(15,20,25,0.9); border: 2px solid #ffaa00; color: #ffaa00; font-size: 0.95rem; padding: 10px 24px; cursor: pointer; font-family: inherit; margin: 0 6px 8px; }
button.test:hover { background: #ffaa0022; }
</style>
</head>
<body>
<h1>实验数据导出</h1>
<p class="subtitle">此页面仅供研究者使用，游戏中无入口</p>

<div class="tab-row">
  <button class="tab-btn active" id="tab-exp" onclick="switchGroup('exp')">实验组（深渊呼吸）</button>
  <button class="tab-btn" id="tab-ctrl" onclick="switchGroup('ctrl')">对照组（钢铁帷幕）</button>
</div>

<div class="stats" id="stats"></div>
<div class="btn-row">
  <button class="action" onclick="downloadCSV()">下载 CSV</button>
  <button class="action" onclick="copyAll()">复制全部数据</button>
  <button class="action" onclick="loadData()">刷新数据</button>
  <button class="test" onclick="pingCloud()">测试云端连通</button>
  <button class="danger" onclick="clearLocal()">清空本机缓存</button>
</div>
<div id="diag" class="diag-box"></div>
<div id="content"><div class="loading">加载中...</div></div>

<script>
var currentData = [];
var dataSource = '';
var currentGroup = 'exp';
var groupNames = { exp: '实验组（深渊呼吸）', ctrl: '对照组（钢铁帷幕）' };
var localKeys = { exp: 'abyssBreathData', ctrl: 'abyssBreathData_ctrl' };

function switchGroup(group) {
  currentGroup = group;
  document.getElementById('tab-exp').className = 'tab-btn' + (group === 'exp' ? ' active' : '');
  document.getElementById('tab-ctrl').className = 'tab-btn' + (group === 'ctrl' ? ' active' : '');
  loadData();
}

function getLocalData() {
  return JSON.parse(localStorage.getItem(localKeys[currentGroup]) || '[]');
}

function loadData() {
  document.getElementById('content').innerHTML = '<div class="loading">正在从云端加载 ' + groupNames[currentGroup] + ' 数据...</div>';
  fetch('/api/export-data?group=' + currentGroup)
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.records && res.records.length > 0) {
        currentData = res.records;
        dataSource = 'cloud';
        render();
      } else {
        fallbackToLocal();
      }
    })
    .catch(function() {
      fallbackToLocal();
    });
}

function fallbackToLocal() {
  currentData = getLocalData();
  dataSource = 'local';
  render();
}

function render() {
  var statsEl = document.getElementById('stats');
  var contentEl = document.getElementById('content');
  var tag = dataSource === 'cloud'
    ? '<span class="source-tag source-cloud">云端数据</span>'
    : '<span class="source-tag source-local">本机缓存</span>';

  statsEl.innerHTML = groupNames[currentGroup] + '：共 <span>' + currentData.length + '</span> 条记录 ' + tag;

  if (currentData.length === 0) {
    contentEl.innerHTML = '<div class="empty">暂无数据</div>';
    return;
  }

  var html = '<table><thead><tr><th>#</th><th>实验编号</th><th>氧气数值</th><th>游戏结局</th><th>时间</th></tr></thead><tbody>';
  for (var i = 0; i < currentData.length; i++) {
    var d = currentData[i];
    var t = d.timestamp ? new Date(d.timestamp).toLocaleString('zh-CN') : '-';
    html += '<tr><td>' + (i + 1) + '</td><td>' + (d.participantId || '-') + '</td><td>' + (d.oxygenValue != null ? d.oxygenValue : '-') + '</td><td>' + (d.ending || '-') + '</td><td>' + t + '</td></tr>';
  }
  html += '</tbody></table>';
  contentEl.innerHTML = html;
}

function toCSV(data) {
  var csv = '\uFEFF实验编号,氧气数值,游戏结局,时间\n';
  for (var i = 0; i < data.length; i++) {
    var d = data[i];
    csv += '"' + (d.participantId || '') + '",' + (d.oxygenValue != null ? d.oxygenValue : '') + ',"' + (d.ending || '') + '","' + (d.timestamp || '') + '"\n';
  }
  return csv;
}

function downloadCSV() {
  if (currentData.length === 0) { alert('没有数据可导出'); return; }
  var blob = new Blob([toCSV(currentData)], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var prefix = currentGroup === 'exp' ? '实验组' : '对照组';
  a.download = prefix + '_实验数据_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function copyAll() {
  if (currentData.length === 0) { alert('没有数据'); return; }
  var text = '实验编号\t氧气数值\t游戏结局\t时间\n';
  for (var i = 0; i < currentData.length; i++) {
    var d = currentData[i];
    text += (d.participantId || '') + '\t' + (d.oxygenValue != null ? d.oxygenValue : '') + '\t' + (d.ending || '') + '\t' + (d.timestamp || '') + '\n';
  }
  navigator.clipboard.writeText(text).then(function() {
    alert('已复制到剪贴板，可直接粘贴到 Excel');
  }).catch(function() {
    prompt('请手动复制：', text);
  });
}

function clearLocal() {
  if (!confirm('确定清空本机' + groupNames[currentGroup] + '的缓存？（不影响云端数据）')) return;
  localStorage.removeItem(localKeys[currentGroup]);
  if (dataSource === 'local') { currentData = []; render(); }
}

function pingCloud() {
  var box = document.getElementById('diag');
  box.className = 'diag-box show';
  box.textContent = '正在测试云端连通...';
  fetch('/api/ping')
    .then(function(r) {
      return r.json().then(function(d) { return { status: r.status, body: d }; });
    })
    .then(function(res) {
      var d = res.body || {};
      var lines = [];
      lines.push((d.ok ? '✓ 云端连通正常' : '✗ 云端连通异常') + '  (HTTP ' + res.status + ')');
      lines.push('环境变量：KV_REST_API_URL=' + (d.envCheck && d.envCheck.KV_REST_API_URL ? '已配置' : '缺失') +
                 ' | KV_REST_API_TOKEN=' + (d.envCheck && d.envCheck.KV_REST_API_TOKEN ? '已配置' : '缺失'));
      if (d.urlInfo) {
        if (d.urlInfo.error) {
          lines.push('URL 解析失败：' + d.urlInfo.error + '（preview: ' + (d.urlInfo.preview || '') + '）');
        } else {
          lines.push('REST URL 协议：' + d.urlInfo.protocol + '  域名：' + d.urlInfo.hostname);
        }
      }
      if (d.kvUrlPreview) lines.push('KV_REST_API_URL 前缀：' + d.kvUrlPreview);
      if (d.altEnv) {
        lines.push('其他变量：KV_URL=' + (d.altEnv.KV_URL || '无') + ' | REDIS_URL=' + (d.altEnv.REDIS_URL || '无'));
      }
      if (d.counts) {
        lines.push('当前云端记录数：实验组(game_data) = ' + (d.counts.exp != null ? d.counts.exp : '-') +
                   '，对照组(game_data_ctrl) = ' + (d.counts.ctrl != null ? d.counts.ctrl : '-'));
      }
      if (!d.ok) {
        if (d.stage) lines.push('失败阶段：' + d.stage);
        if (d.error) lines.push('错误信息：' + d.error);
        if (d.errorName) lines.push('错误类型：' + d.errorName);
        if (d.cause) {
          lines.push('底层原因：' + JSON.stringify(d.cause));
        }
        if (d.set) lines.push('SET 响应：' + JSON.stringify(d.set));
        if (d.get) lines.push('GET 响应：' + JSON.stringify(d.get));
        if (d.stack) lines.push('调用栈：\n' + d.stack.join('\n'));
      }
      lines.push('时间：' + (d.timestamp || ''));
      box.textContent = lines.join('\n');
      box.className = 'diag-box show ' + (d.ok ? 'ok' : 'fail');
    })
    .catch(function(err) {
      box.className = 'diag-box show fail';
      box.textContent = '✗ 测试请求失败：' + (err && err.message || err) + '\n（可能是网络问题或接口未部署）';
    });
}

loadData();
</script>
</body>
</html>
